<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bartan Turn 🍽️</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <header class="top">
      <h1>बर्तन <span>ट्रैकर</span></h1>
      <p class="tagline">jiski baari, uski zimmedari.</p>
    </header>

    <div class="dial-art" aria-hidden="true">
      <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="3.2" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <!-- rotating tick rings -->
        <circle class="tick-ring ring-1" cx="200" cy="200" r="172" fill="none" stroke="var(--pink)" stroke-width="2" stroke-dasharray="2 7" opacity="0.5" style="transform-origin: 200px 200px;" />
        <circle class="tick-ring ring-2" cx="200" cy="200" r="152" fill="none" stroke="var(--teal)" stroke-width="1.5" stroke-dasharray="1 5" opacity="0.4" style="transform-origin: 200px 200px;" />
        <circle class="tick-ring ring-3" cx="200" cy="200" r="132" fill="none" stroke="var(--purple)" stroke-width="1.5" stroke-dasharray="7 4" opacity="0.35" style="transform-origin: 200px 200px;" />

        <!-- segmented glow arc, one quarter per accent color, slowly orbiting as a group -->
        <g class="arc-group" style="transform-origin: 200px 200px;">
          <circle class="arc" cx="200" cy="200" r="172" fill="none" stroke="var(--pink)" stroke-width="4"
            stroke-linecap="round" pathLength="100" stroke-dasharray="20 80" transform="rotate(-45 200 200)" filter="url(#glow)" />
          <circle class="arc" cx="200" cy="200" r="172" fill="none" stroke="var(--teal)" stroke-width="4"
            stroke-linecap="round" pathLength="100" stroke-dasharray="20 80" transform="rotate(45 200 200)" filter="url(#glow)" />
          <circle class="arc" cx="200" cy="200" r="172" fill="none" stroke="var(--purple)" stroke-width="4"
            stroke-linecap="round" pathLength="100" stroke-dasharray="20 80" transform="rotate(135 200 200)" filter="url(#glow)" />
          <circle class="arc" cx="200" cy="200" r="172" fill="none" stroke="var(--amber)" stroke-width="4"
            stroke-linecap="round" pathLength="100" stroke-dasharray="20 80" transform="rotate(225 200 200)" filter="url(#glow)" />
        </g>

        <!-- utensil glyphs at the four corners of the ring -->
        <!-- outer <g> handles fixed position; inner .utensil <g> is scale-only so anime.js's
             CSS transform animation never clobbers the placement. -->
        <g transform="translate(101,101)">
          <g class="utensil fork">
            <rect x="-2.5" y="-2" width="5" height="20" rx="2" fill="var(--porcelain)" />
            <rect x="-6" y="-20" width="2.4" height="18" rx="1" fill="var(--porcelain)" />
            <rect x="-1.2" y="-20" width="2.4" height="18" rx="1" fill="var(--porcelain)" />
            <rect x="3.6" y="-20" width="2.4" height="18" rx="1" fill="var(--porcelain)" />
          </g>
        </g>
        <g transform="translate(299,101)">
          <g class="utensil spoon">
            <rect x="-2.5" y="-2" width="5" height="20" rx="2" fill="var(--porcelain)" />
            <ellipse cx="0" cy="-14" rx="7" ry="9" fill="var(--porcelain)" />
          </g>
        </g>
        <g transform="translate(299,299)">
          <g class="utensil plate">
            <circle cx="0" cy="0" r="16" fill="none" stroke="var(--porcelain)" stroke-width="3" />
            <circle cx="0" cy="0" r="9" fill="none" stroke="var(--porcelain)" stroke-width="1.6" opacity="0.7" />
          </g>
        </g>
        <g transform="translate(101,299)">
          <g class="utensil pot">
            <rect x="-14" y="-8" width="28" height="16" rx="4" fill="var(--porcelain)" />
            <rect x="-20" y="-2" width="6" height="3" rx="1.5" fill="var(--porcelain)" />
            <rect x="14" y="-2" width="6" height="3" rx="1.5" fill="var(--porcelain)" />
          </g>
        </g>

        <!-- center plate-shaped scrub equalizer + diagonal trail, built at runtime -->
        <g id="bars"></g>
        <g id="dots"></g>
      </svg>

      <!-- avatar of today's person, floating in the center of the plate.
           Separate HTML layer (not SVG) so it gets its own nested 3D spin
           independent of the plate's tilt, sharing the same perspective.
           .avatar-mount handles static centering (untouched by anime.js);
           .avatar-wrap is the only element anime.js animates rotateX on. -->
      <div class="avatar-mount">
        <div class="avatar-wrap">
          <div class="avatar-spin">
            <canvas class="avatar-canvas" id="avatar-canvas" hidden></canvas>
            <span class="avatar-initial" id="avatar-initial">—</span>
          </div>
        </div>
      </div>
    </div>

    <aside class="queue-rail">
      <ol class="queue" id="queue-list"></ol>
    </aside>

    <section class="hero" id="turn-card">
      <p class="eyebrow" id="today-label">today</p>
      <h2 class="name" id="today-name">—</h2>
      <button id="skip-btn" class="skip-link">skip →</button>
      <p class="skip-note" id="skip-note"></p>
    </section>
  </main>

  <footer class="foot">
    <button class="history-toggle" id="history-toggle">skip history ▾</button>
    <ul class="history" id="history-list" hidden></ul>
    <p id="status-line"><span class="dot"></span><span id="status-text">connecting…</span></p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="app.js"></script>
  <script type="module" src="dial-animation.js"></script>
  <script type="module" src="avatar-3d.js"></script>
</body>
</html>
